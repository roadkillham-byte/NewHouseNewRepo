name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build-time only — no real database connection is made. Syntactically
          # valid so module-level config (drizzle, the postgres client) doesn't
          # throw while Next collects route data. Real deploys set the actual
          # Supabase URL and secrets as project environment variables.
          DATABASE_URL: "postgresql://user:password@localhost:5432/postgres"
          AUTH_SECRET: "ci-build-only-not-a-real-secret"
          NEXTAUTH_URL: "http://localhost:3000"
